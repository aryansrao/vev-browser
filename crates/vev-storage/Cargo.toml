[package]
name = "vev-storage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AES-256-GCM authenticated encryption for the on-disk envelope. RustCrypto,
# pure Rust, audited, no C build step. Chosen over SQLCipher (real option per
# spec) to avoid the C/OpenSSL build dependency and keep the store trivially
# inspectable for the "unreadable at rest" verification. age was the other
# spec option; aes-gcm is lower-level but has zero extra moving parts for a
# single-key local envelope.
aes-gcm = { version = "0.11", features = ["getrandom"] }
